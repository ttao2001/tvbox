name: Sync fork

on:
  schedule:
    - cron: '0 * * * *'    # 每小时整点运行一次（UTC）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and merge
        run: |
          git remote add upstream https://github.com/qist/tvbox.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || echo "CONFLICT=true" >> $GITHUB_ENV

      - name: Push to fork
        if: env.CONFLICT != 'true'
        run: git push origin main

      - name: Report conflict
        if: env.CONFLICT == 'true'
        run: echo "合并上游时出现冲突，请手动处理"
