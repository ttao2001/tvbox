name: Sync upstream master

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点同步一次
  workflow_dispatch:      # 允许手动运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/qist/tvbox.git || true

      - name: Fetch and merge
        run: |
          git fetch upstream
          git checkout master
          git merge upstream/master --no-edit
          git push origin master
