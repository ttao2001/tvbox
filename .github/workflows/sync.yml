name: Sync fork

on:
  schedule:
    - cron: '0 0 * * *'   # 每天凌晨运行一次；每小时整点运行一次,单0
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/qist/tvbox.git

      - name: Fetch and merge
        run: |
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || echo "CONFLICT=true" >> $GITHUB_ENV

      - name: Push to fork
        if: env.CONFLICT != 'true'
        run: git push origin main
