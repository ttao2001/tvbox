name: Sync fork

on:
  schedule:
    - cron: '0 21 * * *'    # 每小时第 0 分运行（UTC）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream (qist/tvbox)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP=$(curl -s -o resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"branch":"master"}' \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream")

          echo "HTTP CODE: $HTTP"
          cat resp.json

          if [ "$HTTP" -eq 200 ]; then
            MSG=$(cat resp.json | jq -r '.message')
            if [[ "$MSG" == *"This branch is not behind the upstream"* ]]; then
              echo "✅ 同步成功：当前版本已是最新，无需同步"
            else
              echo "⚠️ 存在差异：已自动创建同步 PR，请在 PR 页面手动确认合并"
            fi
          elif [ "$HTTP" -eq 204 ]; then
            echo "✅ 同步成功：无冲突快进合并"
          elif [ "$HTTP" -eq 409 ]; then
            echo "❌ 同步失败：存在严重冲突，请本地手动处理"
            exit 1
          else
            echo "❌ 未知错误: $HTTP"
            cat resp.json
            exit 1
          fi
