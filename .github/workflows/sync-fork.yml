name: Auto Sync Fork via API

on:
  schedule:
    - cron: '0 * * * *' # 每天北京时间 05:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream (qist/tvbox)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP=$(curl -s -o resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"branch":"master"}' \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream")
          
          echo "同步状态码: $HTTP"
          
          if [ "$HTTP" -eq 200 ]; then
            echo "✅ 同步成功：当前版本已是最新"
          elif [ "$HTTP" -eq 204 ]; then
            echo "✅ 同步成功：上游代码已成功合并"
          elif [ "$HTTP" -eq 409 ]; then
            echo "⚠️ 存在冲突：已跳过，请手动处理"
          elif [ "$HTTP" -eq 400 ]; then
            echo "⚠️ 已自动创建合并 PR，请前往页面确认"
          else
            echo "❌ 未知错误，状态码: $HTTP"
            cat resp.json
            exit 1
          fi


